<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#2457ff" />
    <title>Smart Copy — Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #101828;
        background: #f6f8fc;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(100%, 520px);
        padding: 40px;
        border: 1px solid #dce4f2;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 60px rgba(16, 24, 40, 0.08);
      }
      svg {
        display: block;
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 24px 0 10px;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: #526079;
        line-height: 1.6;
      }
      button {
        min-height: 44px;
        margin-top: 28px;
        padding: 0 18px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: #2457ff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #00a6a6;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" role="img" aria-label="Smart Copy">
        <rect width="64" height="64" rx="16" fill="#2457ff" />
        <path
          d="M22 18h20a4 4 0 0 1 4 4v24H22a4 4 0 0 1-4-4V22a4 4 0 0 1 4-4Z"
          fill="#fff"
        />
        <path
          d="M26 27h14M26 34h14M26 41h8"
          stroke="#2457ff"
          stroke-width="3"
          stroke-linecap="round"
        />
      </svg>
      <h1>You’re Offline</h1>
      <p>
        Your saved app shell is available, but Smart Copy needs a connection to
        securely load and update snippets.
      </p>
      <button type="button" onclick="location.reload()">Try Again</button>
    </main>
  </body>
</html>
